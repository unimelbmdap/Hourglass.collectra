collectra_pipeline_metadata:
  name: Hourglass
  version: 0.1.0
  ext: hourglass
  description: Pipeline to detect hourglass in historical artwork.
  logo: Die_Gartenlaube_(1887)_b_888-crop.png
  theme: Hourglass.css


hourglass_detector_yolo:
  type: collectra.ObjectDetectionYOLO
  model: yolo11n.pt
  input: image
  output: hourglass
  params:
    epochs: 200
    imgsz: 1280


hourglass_detector_rfdetr:
  type: collectra.ObjectDetectionRFDETR
  input: image
  output: hourglass

  