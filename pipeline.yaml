Hourglass:
  type: collectra.Pipeline
  name: Hourglass
  version: 0.1.0
  ext: hourglass
  description: Pipeline to detect hourglass in historical artwork.
  logo: HourglassLogo.png
  theme: Hourglass.css
  layouts:
  - layouts/HourglassDefault.yaml


hourglass_detector_yolo:
  type: collectra.ObjectDetectionYOLO
  model: yolo11n.pt
  input: image
  output: hourglass
  params:
    epochs: 200
    imgsz: 1280


hourglass_detector_rfdetr:
  type: collectra.ObjectDetectionRFDETR
  input: image
  output: hourglass

  